<html>

<head>
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/static/style.css">
    
</head>
<body id="not_Home">
    <h2>Admin Login</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/admin" method="post">
        <label>Username:</label>
        <input placeholder="Please enter your admin username " id="dd" type="text" name="username" required><br><br>
        <label>Password:</label>
        <input placeholder="Enter your password"  id="dd" type="password" name="password" required><br><br>
        <button type="submit">Login</button>
    </form>

    <br>
    <a class="btn btn-danger" href="/">Back to Home</a>
</body>
</html>
