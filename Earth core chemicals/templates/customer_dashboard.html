
<html>
<head>
    <title>Customer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/static/style.css">

</head>
<body id="not_Home">
    <a class="btn btn-danger" id="anchorig" href="/">Back to Home</a>
    <pre style="font-size: 40px; color: white;">      Free Item Progress</pre>
{% set cycle = count % 10 %}
{% if cycle == 0 and count > 0 %}
  {% set cycle = 10 %}
{% endif %}

<div  class="progress-container">
   
        <div class="progress-bar" 
     style="width: calc(({{ cycle }}) / 10 * 100%)">

    {{ count }}/10 
</div>
<hr><br><br>
</div>

    <h1>Place Your Order</h1>
    <form action="/place_order" method="POST">
        <label>Item Name:</label><br>
        <select name="item_name">
            <option value="Acetone">Acetone</option>
            <option value="HCl">HCl</option>
            <option value="Acetic Anhydride">Acetic Anhydride</option>
            <option value="Benzyl Chloride">Benzyl Chloride</option>
            <option value="Diethylether">Diethylether</option>
            <option value="Chloroform">Chloroform</option>
            <option value="PalladiumAcetate">Palladium Acetate</option>
            <option value="TrimethylsilylAcetate">TrimethylsilylAcetate</option>
        </select>
        <br><br>

        <label>Quantity:</label>
        <input id="dd" type="number" name="quantity" required min="1">
        <br><br>

        <button type="submit">Buy</button>
    </form>
    
    
</body>
</html>
