<html><head></head>
<title>Personal Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" type="text/css" href="/static/style.css">
<body id="not_Home">
<h2>Personal Details</h2>

   

    <form action="/details" method="post">
        <label>Name:</label>
        <input placeholder="Enter your name" id="dd" type="text" name="Name" required><br><br>
        <label>Address:</label>
        <input placeholder="Enter your residential address" id="dd" type="text" name="address" required><br><br>
        <label>Phone Number:</label>
        <input min="1000000000" max="9999999999" placeholder="Enter your 10-digit mobile number without any country code" id="dd" type="number" name="number" required><br><br>
        <h5>Choose your mode of payment:</h5>
       <label><input  style="padding-left: 50px;" type="radio" value="COD" name="1" checked>COD</label>&nbsp;&nbsp;&nbsp;&nbsp;
        <label><input  type="radio" value="UPI" name="1" disabled>UPI</label>
        <button  type="submit">Proceed</button>
    </form>

    <br>
    <a class="btn btn-danger" href="/">Back to Home</a>




</body></html>
